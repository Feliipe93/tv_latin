# Proxy inverso para los streams de stream-tv-full + lista generada.
# Instalado por instalar.sh (reemplaza __DOMINIO__ y __OUTPUT__).
<VirtualHost *:80>
    ServerName __DOMINIO__

    # Lista M3U y demás salidas del scraper
    Alias /listas/ __OUTPUT__/
    <Directory __OUTPUT__>
        Require all granted
        Options -Indexes
        Header always set Access-Control-Allow-Origin "*"
        Header always set Cache-Control "no-cache"
    </Directory>

    SSLProxyEngine On
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off
    ProxyRequests Off
    ProxyPreserveHost Off
    ProxyTimeout 600

    <Proxy "*">
        Require all granted
    </Proxy>

    # --- deportes1 ---
    ProxyPass        /deportes1/ https://deportes.ksdjugfsddeports.com:9092/ timeout=600 KeepAlive=On
    ProxyPassReverse /deportes1/ https://deportes.ksdjugfsddeports.com:9092/
    <Location /deportes1/>
        RequestHeader set Referer "https://deportes.ksdjugfsddeports.com:9092/"
        RequestHeader set Origin  "https://deportes.ksdjugfsddeports.com:9092"
    </Location>

    # --- deportes2 ---
    ProxyPass        /deportes2/ https://deportes2.ksdjugfsddeports.com:9091/ timeout=600 KeepAlive=On
    ProxyPassReverse /deportes2/ https://deportes2.ksdjugfsddeports.com:9091/
    <Location /deportes2/>
        RequestHeader set Referer "https://deportes2.ksdjugfsddeports.com:9091/"
        RequestHeader set Origin  "https://deportes2.ksdjugfsddeports.com:9091"
    </Location>

    # --- general ---
    ProxyPass        /general/ https://live.saohgdasregions.fun:9092/ timeout=600 KeepAlive=On
    ProxyPassReverse /general/ https://live.saohgdasregions.fun:9092/
    <Location /general/>
        RequestHeader set Referer "https://live.saohgdasregions.fun/"
        RequestHeader set Origin  "https://live.saohgdasregions.fun"
    </Location>

    # --- regionales ---
    ProxyPass        /regionales/ https://regionales.saohgdasregions.fun:9092/ timeout=600 KeepAlive=On
    ProxyPassReverse /regionales/ https://regionales.saohgdasregions.fun:9092/
    <Location /regionales/>
        RequestHeader set Referer "https://regionales.saohgdasregions.fun:9092/"
        RequestHeader set Origin  "https://regionales.saohgdasregions.fun:9092"
    </Location>

    # --- playlist (200.125.170.122:8000) ---
    ProxyPass        /playlist/ http://200.125.170.122:8000/ timeout=600 KeepAlive=On
    ProxyPassReverse /playlist/ http://200.125.170.122:8000/

    # Cabeceras comunes a todo lo que pasa por el proxy (CORS + sin caché intermedia)
    <LocationMatch "^/(deportes1|deportes2|general|regionales|playlist)/">
        RequestHeader unset X-Forwarded-For
        RequestHeader unset X-Forwarded-Host
        RequestHeader unset X-Forwarded-Server
        Header always set Access-Control-Allow-Origin "*"
        Header always set Access-Control-Allow-Methods "GET, HEAD, OPTIONS"
        Header always set Access-Control-Allow-Headers "Range,Origin,Accept,Content-Type"
        Header always set Access-Control-Expose-Headers "Content-Length,Content-Range"
        Header always set Cache-Control "no-cache, no-store, must-revalidate"
        Require all granted
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/tv-latin-error.log
    CustomLog ${APACHE_LOG_DIR}/tv-latin-access.log combined
</VirtualHost>
