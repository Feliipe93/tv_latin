name: Actualizar lista

on:
  schedule:
    - cron: "0 6 * * *"   # todos los días a las 06:00 UTC
  workflow_dispatch:
  push:
    paths:
      - canales.txt
      - filtrar.py

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar tv_latin.m3u
        run: python filtrar.py

      - name: Subir cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv_latin.m3u
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Actualizar tv_latin.m3u"
          git push
